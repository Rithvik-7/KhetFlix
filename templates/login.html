<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Khetflix Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#080808;
  --primary:#ff4d4d;
  --primary2:#ff7b7b;

  --text:#f5f5f5;
  --muted:#9d9d9d;

  --border:rgba(255,255,255,0.08);

  --font-head:'Playfair Display', serif;
  --font-body:'Poppins', sans-serif;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#080808;

  overflow:hidden;

  font-family:var(--font-body);

  color:var(--text);

  position:relative;
}

/* BACKGROUND GLOW */

body::before{
  content:'';

  position:absolute;

  width:700px;
  height:700px;

  background:
  radial-gradient(circle,
  rgba(255,77,77,0.15),
  transparent 70%);

  top:-250px;
  left:-250px;

  filter:blur(80px);
}

body::after{
  content:'';

  position:absolute;

  width:500px;
  height:500px;

  background:
  radial-gradient(circle,
  rgba(255,77,77,0.08),
  transparent 70%);

  bottom:-200px;
  right:-200px;

  filter:blur(80px);
}

/* LOGIN CARD */

.login-card{
  width:420px;

  background:rgba(255,255,255,0.04);

  border:1px solid var(--border);

  backdrop-filter:blur(18px);

  border-radius:30px;

  padding:42px;

  position:relative;
  z-index:2;

  box-shadow:
  0 20px 60px rgba(0,0,0,0.45);
}

/* CENTER LOGO */

.logo{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  margin-bottom:38px;
}

.logo-box{
  width:62px;
  height:62px;

  border-radius:18px;

  background:linear-gradient(135deg,var(--primary),var(--primary2));

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:
  0 0 35px rgba(255,77,77,0.4);

  margin-bottom:14px;
}

.logo-box svg{
  width:28px;
  height:28px;
}

.logo-text{
  font-size:1.1rem;

  font-weight:700;

  letter-spacing:0.22em;

  background:linear-gradient(to right,var(--primary),var(--primary2));

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TEXT */

.login-card h1{
  font-family:var(--font-head);

  font-size:2.4rem;

  text-align:center;

  margin-bottom:10px;
}

.login-card p{
  color:var(--muted);

  line-height:1.7;

  text-align:center;

  margin-bottom:34px;
}

/* INPUTS */

.input-group{
  margin-bottom:22px;
}

.input-group label{
  display:block;

  margin-bottom:10px;

  font-size:0.9rem;

  color:#d8d8d8;
}

.input-group input{
  width:100%;

  padding:16px 18px;

  border:none;

  outline:none;

  border-radius:16px;

  background:rgba(255,255,255,0.05);

  border:1px solid rgba(255,255,255,0.06);

  color:white;

  font-size:0.95rem;

  transition:0.3s;
}

.input-group input:focus{
  border-color:rgba(255,77,77,0.5);

  box-shadow:
  0 0 20px rgba(255,77,77,0.18);
}

/* OPTIONS */

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:28px;

  font-size:0.85rem;
}

.options a{
  color:var(--primary2);

  text-decoration:none;
}

/* BUTTON */

.login-btn{
  width:100%;

  padding:16px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,var(--primary),var(--primary2));

  color:white;

  font-size:1rem;
  font-weight:600;

  cursor:pointer;

  transition:0.3s;

  box-shadow:
  0 0 30px rgba(255,77,77,0.3);
}

.login-btn:hover{
  transform:translateY(-3px);

  box-shadow:
  0 0 40px rgba(255,77,77,0.45);
}

/* FOOT */

.bottom-text{
  text-align:center;

  margin-top:26px;

  color:var(--muted);

  font-size:0.9rem;
}

.bottom-text a{
  color:var(--primary2);

  text-decoration:none;
}

/* MOBILE */

@media(max-width:500px){

  .login-card{
    width:92%;

    padding:30px;
  }

  .login-card h1{
    font-size:2rem;
  }
}

</style>
</head>

<body>

<div class="login-card">

  <div class="logo">

    <div class="logo-box">

      <!-- SAME SVG LOGO FROM INDEX.HTML -->

      <svg viewBox="0 0 24 24" fill="none" stroke="#080808" stroke-width="2.2">
        <path d="M12 2C6 2 3 7 3 12c0 3.5 2 6.5 5 8 0-4 2-8 4-10-1 3-1 7 0 10 3-1.5 5-4.5 5-8 0-5-2-10-5-10z"/>
      </svg>

    </div>

    <div class="logo-text">
      KHETFLIX
    </div>

  </div>

  <h1>Welcome Back</h1>

  <p>
    Login to access AI-powered farming intelligence and smart crop insights.
  </p>

  <form method="POST" action="/login">

    <div class="input-group">
      <label>Email Address</label>

      <input type="email" placeholder="Enter your email">
    </div>

    <div class="input-group">
      <label>Password</label>

      <input type="password" placeholder="Enter your password">
    </div>

    <div class="options">

      <label>
        <input type="checkbox">
        Remember me
      </label>

      <a href="#">Forgot Password?</a>

    </div>

    <button class="login-btn" type="submit">
      Login
    </button>

  </form>

  <div class="bottom-text">
    Don’t have an account?
    <a href="#">Create Account</a>
  </div>

</div>

</body>
</html>
